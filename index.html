    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Does my audio leave the device?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. After the Whisper model is cached in your browser, transcription runs entirely on your device. Audio files, microphone recordings, and video soundtracks are not uploaded to our servers for processing."
            }
          },
          {
            "@type": "Question",
            "name": "Which languages does this free speech to text tool support?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The underlying Whisper model is multilingual. This interface lets you pick English, French, or Swahili for faster setup; Whisper can still recognize many other languages when speech is clear."
            }
          },
          {
            "@type": "Question",
            "name": "Can I export subtitles or a transcript file?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. After transcription finishes, copy the plain text or download TXT and SRT files. SRT uses word-level timestamps from the timestamped Whisper model so you can edit captions in any video editor."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need an account or API key?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No sign-up and no API key are required. Open the page, load the model once (a one-time download that browsers cache), then transcribe as often as you like at no charge."
            }
          },
          {
            "@type": "Question",
            "name": "What audio and video formats can I use?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "You can record from your microphone in the page or upload common audio and video files from your device. The tool extracts audio at 16 kHz for Whisper; for long clips, use a desktop browser with enough memory and WebGPU when available for faster inference."
            }
          }
        ]
      }
    </script>
